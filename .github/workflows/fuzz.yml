name: fuzz

on:
  workflow_dispatch:
  pull_request:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: taiki-e/install-action@cargo-fuzz
      - name: run every target (TASKS.md W0.4 exit criterion, W2 fuzz coverage)
        working-directory: fuzz
        run: |
          cargo fuzz run fuzz_sniff    -- -runs=200
          cargo fuzz run fuzz_locator  -- -runs=200
          cargo fuzz run fuzz_splitter -- -runs=200
          cargo fuzz run fuzz_pipeline -- -runs=200
