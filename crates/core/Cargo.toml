[package]
name = "quantification-core"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
strict_validate = []
bench_stages = []

[dependencies]
twox-hash = { version = "2.1.2", default-features = false, features = [
    "std",
    "xxhash3_128",
    "xxhash3_64",
] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = [
    "cargo_bench_support",
] }

[[bench]]
name = "stages"
harness = false
test = false
required-features = ["bench_stages"]

[[bench]]
name = "gate"
harness = false
test = false
required-features = ["bench_stages"]
